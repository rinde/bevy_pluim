# Bevy's own linter (see `just bevy-lint`) flags the panicking accessors in
# favour of the fallible ones, but it needs a nightly toolchain and trails Bevy
# releases. Encoding the same rule here keeps it enforced on stable, in CI,
# today. A system that unwraps one of these takes the whole app down.
disallowed-methods = [
    { path = "bevy_ecs::system::Query::single", reason = "invites `.unwrap()`; take a `Single` system param, or iterate" },
    { path = "bevy_ecs::system::Query::single_mut", reason = "invites `.unwrap()`; take a `Single` system param, or iterate" },
    { path = "bevy_ecs::world::World::resource", reason = "panics if the resource is missing; prefer `get_resource`" },
    { path = "bevy_ecs::world::World::resource_mut", reason = "panics if the resource is missing; prefer `get_resource_mut`" },
]
