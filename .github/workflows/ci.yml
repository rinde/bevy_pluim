name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Full debuginfo in Bevy-linked test binaries fills the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# A new push to a branch makes the run already in flight for it pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format, clippy and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-dev libwayland-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: Read pinned Rust toolchain version
        id: toolchain
        run: echo "version=$(just rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: just lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-dev libwayland-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: Read pinned Rust toolchain version
        id: toolchain
        run: echo "version=$(just rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # Keep these commands in step with `just test`; separating the build
      # makes compilation and execution times visible in the Actions UI.
      - name: Compile tests
        run: cargo nextest run --all-targets --no-run
      - name: Run tests
        run: cargo nextest run --all-targets
      - name: Run doctests
        run: cargo test --quiet --doc

  unused-deps:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-machete
      - run: just unused-deps

  cross-check:
    name: Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: Read pinned Rust toolchain version
        id: toolchain
        shell: bash
        run: echo "version=$(just rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  # Renders every scenario of tests/ron offscreen on a software GPU (lavapipe)
  # and keeps the recordings. Not part of `just ci`, and it has not been run on
  # GitHub yet: see AGENTS.md.
  record:
    name: Record scenarios
    runs-on: ubuntu-latest
    env:
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies and software Vulkan (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-dev libwayland-dev \
            mesa-vulkan-drivers libvulkan1
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: Read pinned Rust toolchain version
        id: toolchain
        run: echo "version=$(just rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # Keep the target, features and selection in step with `just record`.
      - name: Compile scenario recorder
        run: cargo nextest run --test recorded_scenarios_gpu --features record --run-ignored all --no-capture --no-run
      - name: Record scenarios
        run: cargo nextest run --test recorded_scenarios_gpu --features record --run-ignored all --no-capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recordings
          path: target/recordings
          if-no-files-found: warn
          retention-days: 14
