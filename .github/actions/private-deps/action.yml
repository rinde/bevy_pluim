name: Private dependencies
description: >-
  Lets Cargo fetch the private rinde/bevy_stagecraft repository by sending
  a token with read access to it whenever git talks to github.com.
inputs:
  token:
    description: Token with read access to rinde/bevy_stagecraft.
    required: true
runs:
  using: composite
  steps:
    - name: Configure git credentials
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        if [ -z "$TOKEN" ]; then
          echo "::error::TESTER_REPO_TOKEN is empty: add a secret with read access to rinde/bevy_stagecraft"
          exit 1
        fi
        echo "::add-mask::$TOKEN"
        git config --global url."https://x-access-token:${TOKEN}@github.com/rinde/bevy_stagecraft".insteadOf "https://github.com/rinde/bevy_stagecraft"
