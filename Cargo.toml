[package]
name = "rin_bevy_ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/rinde/rin-bevy-ui"
# Private software: never publish to a registry.
publish = false

[dependencies]
bevy = "0.19.1"
derive_more = { version = "2.0.1", features = ["deref"] }
educe = { version = "0.6.0", default-features = false, features = ["Default"] }
itertools = "0.14.0"
smallvec = "1.15.1"
strum = { version = "0.27.2", features = ["derive"] }

[dev-dependencies]
# The examples toggle `UiDebugOptions`, which only exists with `bevy_ui_debug`.
bevy = { version = "0.19.1", features = ["bevy_ui_debug"] }
bevy_egui = { version = "0.40.1", features = ["render", "serde"] }
bevy-inspector-egui = "0.37.0"

[lints.rust]
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "deny"
single_use_lifetimes = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unstable_features = "forbid"
unused_crate_dependencies = "allow"    # per-target: every example/test "misses" the others' deps; `cargo machete` in `just ci` covers it
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
dead_code = "warn"
unused = { level = "warn", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
missing_crate_level_docs = "deny"

[lints.clippy]
### Groups
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Bevy-shaped allows: these lints fight how Bevy systems are written.
too_many_arguments = "allow"     # every system param is an argument
needless_pass_by_value = "allow" # `In<_>`, `Res<_>` and `Trigger<_>` are taken by value
type_complexity = "allow"        # nested `Query<(..), (With<_>, Without<_>)>` types

# Pedantic lints that cost more than they give here.
too_many_lines = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"

### Individual lints
disallowed-types = "deny"
missing_const_for_fn = "deny"

allow_attributes = "deny"
allow_attributes_without_reason = "deny"

### Restrictions
exit = "warn"
unreachable = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"

# Bevy is unusably slow in an unoptimised build, so optimise dependencies but
# not our own code, which keeps the edit-run loop short.
[profile.dev.package."*"]
opt-level = 3
