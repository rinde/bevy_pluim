[package]
name = "bevy_pluim"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/rinde/bevy_pluim"
# Private software: never publish to a registry.
publish = false

[features]
# Records the scenarios in tests/ron offscreen for review (`just record`). Only
# the `recorded_scenarios_gpu` test target uses it, and it needs a GPU.
record = ["bevy_stagecraft/record"]

[dependencies]
accesskit = "0.24"
bevy = "0.20.0"
derive_more = { version = "2.0.1", features = ["deref"] }
educe = { version = "0.6.0", default-features = false, features = ["Default"] }
itertools = "0.14.0"
smallvec = "1.15.1"
strum = { version = "0.27.2", features = ["derive"] }

[dev-dependencies]
# The examples toggle `UiDebugOptions`, which only exists with `bevy_ui_debug`.
# `debug` is Bevy's switch for `ScheduleBuildSettings::shuffle_seed`, which
# `tests/scenarios.rs` shuffles the schedules with.
bevy = { version = "0.20.0", features = ["bevy_ui_debug", "debug"] }
# Private test driver for scenario tests. Pinned to a revision so the build is
# reproducible; bump it deliberately, and see AGENTS.md for how it is fetched.
# `gallery` is for `examples/gallery.rs`: real windows and the renderer.
bevy_stagecraft = { git = "https://github.com/rinde/bevy_stagecraft", rev = "cd54a1bfbd7f12867ec1917a2133898f01b86dda", features = ["gallery"] }

# Plays every `.ron` file and variant in tests/ron as an individual libtest
# case. `build.rs` generates the cases so libtest can schedule them in parallel.
[[test]]
name = "ron_scenarios"

# Renders every scenario of tests/ron offscreen. Needs a (software) GPU, so it
# is only built with the `record` feature, and its test is `#[ignore]`d.
[[test]]
name = "recorded_scenarios_gpu"
required-features = ["record"]

[lints.rust]
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "deny"
single_use_lifetimes = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unstable_features = "forbid"
unused_crate_dependencies = "allow"    # per-target: every example/test "misses" the others' deps; `cargo machete` in `just ci` covers it
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
dead_code = "warn"
unused = { level = "warn", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
missing_crate_level_docs = "deny"

[lints.clippy]
### Groups
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Bevy-shaped allows: these lints fight how Bevy systems are written.
too_many_arguments = "allow"     # every system param is an argument
needless_pass_by_value = "allow" # `In<_>`, `Res<_>` and `Trigger<_>` are taken by value
type_complexity = "allow"        # nested `Query<(..), (With<_>, Without<_>)>` types

# Pedantic lints that cost more than they give here.
too_many_lines = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"

### Individual lints
missing_const_for_fn = "deny"

allow_attributes = "deny"
allow_attributes_without_reason = "deny"

### Restrictions
exit = "warn"
unreachable = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"

# Bevy is unusably slow in an unoptimised build, so optimise dependencies but
# not our own code, which keeps the edit-run loop short. Dependencies also get
# no debuginfo: with it every test or example binary is about 2 GB, and a
# slot's `target/debug` outgrew a cloud container's disk. Our own crate keeps
# its debuginfo. To step through a dependency, bring it back for one
# invocation: `cargo --config 'profile.dev.package."*".debug=true' test ...`.
[profile.dev.package."*"]
opt-level = 3
debug = false
