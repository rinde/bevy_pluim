[package]
name = "bevy_pluim"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
repository = "https://github.com/rinde/bevy_pluim"
publish = false

[features]
# Needs a GPU; used only by `recorded_scenarios_gpu`.
record = ["bevy_stagecraft/record"]

[dependencies]
accesskit = "0.24"
# No default features: the application picks the platform and renderer.
bevy = { version = "0.20.1", default-features = false, features = ["ui_api", "scene", "picking", "bevy_ui_widgets", "bevy_render"] }
derive_more = { version = "2.0.1", features = ["deref"] }
educe = { version = "0.6.0", default-features = false, features = ["Default"] }
itertools = "0.14.0"
smallvec = "1.15.1"
strum = { version = "0.27.2", features = ["derive"] }

[dev-dependencies]
# `bevy_ui_debug` for `UiDebugOptions`; `debug` for `ScheduleBuildSettings::shuffle_seed`.
bevy = { version = "0.20.1", default-features = true, features = ["bevy_ui_debug", "debug"] }
# Pin `rev`; bump it together with Cargo.lock.
bevy_stagecraft = { git = "https://github.com/rinde/bevy_stagecraft", rev = "54d21fe7ef3f60f8d41c1e2f1c4ffb1f0590ac40", features = ["gallery"] }

# `build.rs` generates the test cases.
[[test]]
name = "ron_scenarios"

[[test]]
name = "recorded_scenarios_gpu"
required-features = ["record"]

[lints.rust]
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "deny"
single_use_lifetimes = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unstable_features = "forbid"
unused_crate_dependencies = "allow"    # misfires per target; `cargo machete` checks instead
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
dead_code = "warn"
unused = { level = "warn", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
missing_crate_level_docs = "deny"

[lints.clippy]
### Groups
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

too_many_arguments = "allow"     # systems take many params
needless_pass_by_value = "allow" # systems take `In<_>`, `Res<_>`, `Trigger<_>` by value
type_complexity = "allow"        # nested `Query` types

too_many_lines = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
assert_is_empty = "allow"        # `assert!(x.is_empty())` reads better in tests

### Individual lints
missing_const_for_fn = "deny"

allow_attributes = "deny"
allow_attributes_without_reason = "deny"

### Restrictions
exit = "warn"
unreachable = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"

# Bevy is unusably slow unoptimized. No debuginfo: it made binaries ~2 GB and
# filled cloud disks.
[profile.dev.package."*"]
opt-level = 3
debug = false
